# amcl.yaml
# Localization parameters for the courier's one-command bringup.
#
# Only map_server and AMCL are configured here, because those are the only two
# nodes nav2_bringup's localization_launch.py starts. The Nav2 servers keep the
# course's own acadbot_navigation/config/nav2_params.yaml -- nothing about the
# planner, the controller or the recovery behaviours changes for this project,
# and the two files are passed to two different launches so neither has to be
# a copy of the other.
#
# The AMCL block below is the course's, verbatim, plus one addition:
# set_initial_pose. Without it AMCL publishes nothing at all until somebody
# clicks 2D Pose Estimate in RViz, which would make "one command brings it up"
# untrue -- and worse, the Nav2 costmaps cannot configure without map->odom, so
# the whole stack would sit INACTIVE waiting for a mouse.
#
# (0, 0, 0) is where the robot spawns. The map frame's origin is wherever the
# robot stood when Session 2 mapping began, which is that same spawn point at
# Gazebo (-3, -2); the map metadata agrees, its 160x120 grid at origin
# [-1.054, -1.009] bracketing the room's interior under map = gazebo + (3, 2).
# Change the spawn (simulation.launch.py's x/y/yaw) and this has to change too.

# There is deliberately no map_server block here. nav2_bringup's
# localization_launch.py passes the map path to that node itself, as
# parameters=[params_file, {'yaml_filename': map_yaml_file}] -- and a
# yaml_filename written in this file WINS over that override rather than
# losing to it, which leaves map_server active but empty:
#
#   map_server: yaml-filename parameter is empty, set map through 'load_map'-service
#   amcl:       Waiting for map....      (forever)
#
# So the map comes from the launch file's map: argument and nothing else.
# acadbot_navigation/config/nav2_params.yaml has no map_server block either,
# for the same reason.

# There is deliberately no set_initial_pose either, though it looks like
# exactly the right tool. AMCL applies it the instant it activates, which is
# about 0.4s after its process starts -- before it has received a single
# /clock message, so use_sim_time leaves now() at zero and the pose is stamped
# t=0, a time for which no odom->base_footprint has ever existed:
#
#   [amcl] Setting pose (0.000000): 0.000 0.000 0.000
#
# The pose is accepted and no transform ever becomes valid. Delaying the launch
# does not help: the race is between AMCL's own activation and its own first
# clock message, so it moves with it. courier.launch.py publishes /initialpose
# instead, once, after the clock is unambiguously running.

amcl:
  ros__parameters:
    use_sim_time: true

    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"

    # How stale a transform AMCL will accept. Set explicitly because it is
    # also the window it allows when looking up base_footprint->odom for an
    # incoming initial pose, and that lookup asks for "now" while TF is
    # habitually a few milliseconds behind:
    #   Requested time 9.867 but the latest data is at time 9.860
    transform_tolerance: 1.0
    scan_topic: scan
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    min_particles: 500
    max_particles: 2000
    laser_max_range: 12.0
    laser_min_range: 0.12
    max_beams: 120
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    update_min_a: 0.2
    update_min_d: 0.25
